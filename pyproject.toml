[project]
name = "atlas"
version = "0.1.0"
description = "Atlas: a tool-retrieval agent that stays accurate with 100+ API tools"
readme = "README.md"
authors = [
    { name = "Ajay A", email = "drewjay05@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu==1.15.1",
    "jsonschema>=4.26.0",
    "langchain==1.4.7",
    "langchain-openai==1.7.2",
    "langsmith==0.14.12",
    "pydantic-settings>=2.16.1",
    "sentence-transformers>=6.2.0",
    "typer>=0.27.3",
]

[project.scripts]
atlas = "atlas.cli:app"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
